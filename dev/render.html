<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Card renderer check</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow+Condensed:wght@600&display=swap">
  <style>
    body { margin: 0; background: #15151a; color: #ddd; font: 14px sans-serif; }
    .row { display: flex; gap: 16px; padding: 12px; }
    figure { margin: 0; }
    figcaption { padding: 4px 0; }
    canvas, img { width: 600px; height: 840px; display: block; }
    .wide canvas, .wide img { width: 840px; height: 600px; }
  </style>
</head>
<body>
  <!-- Development check for js/render.js through the local server (npm start):
       /dev/render.html?ids=OP1-022,OP1-020&compare=1 puts the Card Engine PNG beside each render.
       Card data and frames come from data/ in the shared folder, never from the repo. -->
  <div id="out"></div>
  <script type="module">
    import { loadTemplate, renderCard, fontsReady, loadImage, templateName, RENDER_OPTS } from '../js/render.js';

    const q = new URLSearchParams(location.search);
    const ids = (q.get('ids') ?? '').split(',').filter(Boolean);
    // ?chips=1: bonus boje "+N stat" kao čip (mockup); ?chips=both: svaka karta dvaput, sad i s čipom.
    const chipsMode = q.get('chips');
    const out = document.getElementById('out');
    const db = await (await fetch('/data/cards.json', { cache: 'no-store' })).json();
    const drafts = await fetch('/data/editor/drafts.json', { cache: 'no-store' }).then(r => (r.ok ? r.json() : { cards: {} }));
    const hasAgency = await fontsReady();
    const templates = {};
    const templateOf = async card => {
      const name = templateName(card);
      templates[name] ??= await loadTemplate(name, async rel => `/data/${rel}`);
      return templates[name];
    };
    if (!hasAgency) out.append(Object.assign(document.createElement('p'), { textContent: 'Agency FB is not installed: a stand-in font is used.' }));
    // ?test=1: izmišljene karte s najgorim slučajevima bonusa boje (nisu u bazi; art posuđen s OP1-017).
    const artFrom = { ...(db.cards.find(c => c.id === 'OP1-017') ?? {}), ...(drafts.cards?.['OP1-017'] ?? {}) };
    const TEST = [
      // At most two bonus colours per card (design rule, 2026-11-04).
      { id: 'TEST-1', name: 'Two colours, four bonuses', type: 'Action', color: 'None', bonusColors: ['Yellow', 'Red'], cost: 3,
        bonus: { dmg: 1, pwr: 1000, kb: 1 }, traits: ['General'],
        text: 'Battle Phase:\nYellow Bonus: +1 DMG.\nYellow Bonus: +1 KB.\nRed Bonus: +1000 Power.\nRed Bonus: +1 Range.' },
      { id: 'TEST-2', name: 'Two colours, one bonus', type: 'Equipment', color: 'None', bonusColors: ['Cyan', 'Purple'], cost: 2,
        bonus: { dmg: 1 }, traits: ['Sword'], text: 'The equipped Hero takes +1 DMG from all sources.\nCyan / Purple Bonus: +1 DMG.' },
      { id: 'TEST-3', name: 'Two colours, two bonuses', type: 'Action', color: 'None', bonusColors: ['Yellow', 'Red'], cost: 2,
        bonus: { dmg: 1, pwr: 2000 }, traits: ['Haki'], text: 'Battle Phase:\nYellow Bonus: +1 DMG.\nRed Bonus: +2 DMG.\nRed Bonus: +2000 Power.' },
      { id: 'TEST-4', name: 'Bonus only for a colour', type: 'Assist', color: 'None', bonusColors: ['Blue'], cost: 1,
        bonus: {}, traits: ['General'], text: 'Preroll Phase: A friendly Hero heals 2 HP.\nBlue Bonus: +1000 Power.\nBlue Bonus: +1 KB.' },
      { id: 'TEST-5', name: 'Minus and a sentence', type: 'Action', color: 'None', bonusColors: ['Purple', 'Green'], cost: 2,
        bonus: { kb: 2, pwr: 1000 }, traits: ['General'], text: '[Range] Postroll Phase: Knockback an Opponent\'s Hero 2 spaces.\nPurple Bonus: -1 KB.\nGreen Bonus: It also heals 2 HP.' },
    ].map(c => ({ ...c, art: artFrom.art, artCrop: artFrom.artCrop }));
    const cards = q.get('test') ? TEST : ids.map(id => { const base = db.cards.find(c => c.id === id); return base ? { ...base, ...(drafts.cards?.[id] ?? {}) } : null; }).filter(Boolean);
    for (const card of cards) {
      const id = card.id;
      const tpl = await templateOf(card);
      const row = document.createElement('div');
      row.className = tpl.layout.kind === 'hero' ? 'row wide' : 'row';
      if (q.get('compare')) {
        const fig = document.createElement('figure');
        const img = document.createElement('img');
        const dir = tpl.layout.kind === 'hero' ? 'Sve Karte Landscape' : 'Sve Karte Portrait';
        const ce = n => `/data/card-engine/Za Poslat/${dir}/${encodeURIComponent(n)}.png`;
        const names = [card.name, `${card.id} ${card.name} Hero`, `${card.id} ${card.name}`];
        let k = 0;
        img.src = ce(names[k]);
        img.onerror = () => { if (++k < names.length) img.src = ce(names[k]); else img.onerror = null; };
        fig.append(img, Object.assign(document.createElement('figcaption'), { textContent: `Card Engine · ${card.name}` }));
        row.append(fig);
      }
      const fig = document.createElement('figure');
      const canvas = document.createElement('canvas');
      const art = card.art ? await loadImage(`/data/${card.art}`).catch(() => null) : null;
      const emblem = card.emblem ? await loadImage(`/data/${card.emblem}`).catch(() => null) : null;
      RENDER_OPTS.bonusChips = chipsMode === '1' ? true : ['inline', 'band', 'rows', 'hex', 'slot', 'foot'].includes(chipsMode) ? chipsMode : false;
      const warnings = renderCard(canvas, card, tpl, art, emblem);
      fig.append(canvas, Object.assign(document.createElement('figcaption'), { textContent: `${chipsMode === 'both' ? 'Now · ' : ''}Editor renderer${tpl.layers || tpl.frames ? '' : ' (interim frame)'} · ${warnings.join(' ') || 'no warnings'}` }));
      row.append(fig);
      const SHEET = { both: [[true, 'Bonus as a chip'], ['inline', 'Bonus after the number']], three: [['band', '1 · band of pills'], ['rows', '2 · second row'], ['hex', '3 · hex badges']] };
      for (const [mode, label] of SHEET[chipsMode] ?? []) {
        const fig2 = document.createElement('figure');
        const c2 = document.createElement('canvas');
        RENDER_OPTS.bonusChips = mode;
        renderCard(c2, card, tpl, art, emblem);
        RENDER_OPTS.bonusChips = false;
        fig2.append(c2, Object.assign(document.createElement('figcaption'), { textContent: label }));
        row.append(fig2);
      }
      out.append(row);
    }
    document.body.dataset.ready = '1';
  </script>
</body>
</html>
